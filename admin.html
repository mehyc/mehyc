<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chan Hyc · 管理介面</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: radial-gradient(circle at 10% 20%, #0b0d17, #03030a);
            font-family: 'Inter', system-ui, sans-serif;
            color: #f0f0f5;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .admin-container {
            max-width: 700px;
            margin: 0 auto;
        }

        /* ===== 頂部標題列 ===== */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding: 0.5rem 0;
        }
        .top-bar .title-box h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(115deg, #FFF, #cdc7ff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .top-bar .title-box p {
            font-size: 0.75rem;
            color: #8e93b0;
            margin-top: 2px;
        }
        .logout-top-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0.6rem 1.2rem;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            border-radius: 60px;
            color: #fca5a5;
            font-size: 0.85rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: 0.25s;
            white-space: nowrap;
        }
        .logout-top-btn:hover {
            background: rgba(239, 68, 68, 0.3);
            color: #fff;
        }
        .logout-top-btn i { font-size: 0.85rem; }

        /* ===== 登入畫面 ===== */
        .login-box {
            background: rgba(18, 22, 35, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 2rem;
            padding: 2.5rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 400px;
            margin: 3rem auto;
        }
        .login-box .lock-icon {
            font-size: 3rem;
            color: #b7adff;
            margin-bottom: 1rem;
        }
        .login-box h2 {
            font-size: 1.3rem;
            color: #e0e2f5;
            margin-bottom: 1.5rem;
        }
        .password-input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 60px;
            color: #f0f0f5;
            font-size: 1rem;
            font-family: inherit;
            margin-bottom: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .password-input:focus { border-color: #aa4eff; }
        .login-btn {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, #6f5cf1, #aa4eff);
            border: none;
            border-radius: 60px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: 0.25s;
            box-shadow: 0 4px 12px rgba(106, 90, 205, 0.4);
        }
        .login-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 20px rgba(106, 90, 205, 0.6);
        }
        .login-error {
            color: #ef4444;
            font-size: 0.85rem;
            margin-top: 0.8rem;
            min-height: 20px;
        }

        /* ===== 主選單（一排一排） ===== */
        .main-menu { display: none; }
        .main-menu.active { display: block; }

        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
            margin-top: 1rem;
        }

        .menu-row {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            background: rgba(18, 22, 35, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 1.5rem;
            padding: 1.3rem 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: 0.25s;
        }
        .menu-row:hover {
            transform: translateX(6px);
            border-color: rgba(170, 126, 255, 0.5);
            box-shadow: 0 15px 35px rgba(106, 90, 205, 0.3);
            background: rgba(25, 30, 48, 0.9);
        }
        .menu-row .row-icon {
            width: 52px;
            height: 52px;
            min-width: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            background: linear-gradient(135deg, rgba(111, 92, 241, 0.3), rgba(170, 78, 255, 0.3));
            color: #b7adff;
        }
        .menu-row .row-content {
            flex: 1;
        }
        .menu-row .row-label {
            font-size: 1.05rem;
            font-weight: 600;
            color: #e0e2f5;
            margin-bottom: 2px;
        }
        .menu-row .row-desc {
            font-size: 0.75rem;
            color: #6a6f8a;
        }
        .menu-row .row-arrow {
            font-size: 1rem;
            color: #6a6f8a;
            transition: 0.25s;
        }
        .menu-row:hover .row-arrow {
            color: #b7adff;
            transform: translateX(4px);
        }

        /* ===== 編輯頁面 ===== */
        .edit-page { display: none; }
        .edit-page.active { display: block; }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 0.6rem 1.2rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 60px;
            color: #8e93b0;
            font-size: 0.85rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: 0.25s;
            margin-bottom: 1.5rem;
        }
        .back-btn:hover {
            background: rgba(85, 70, 180, 0.3);
            color: #e0e2f5;
        }

        .edit-card {
            background: rgba(18, 22, 35, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 2rem;
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }
        .edit-card h3 {
            font-size: 1.2rem;
            color: #cdc7ff;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .edit-card h3 i { color: #b7adff; }

        .form-group { margin-bottom: 1.2rem; }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #9f9fcf;
            margin-bottom: 0.4rem;
            font-weight: 500;
        }
        .form-input, .form-textarea, .form-select {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            color: #f0f0f5;
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-input:focus, .form-textarea:focus, .form-select:focus {
            border-color: #aa4eff;
        }
        .form-textarea {
            min-height: 200px;
            resize: vertical;
            line-height: 1.7;
        }
        .form-select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238e93b0' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1em;
            padding-right: 2.5rem;
        }
        .form-select option {
            background: #1a1e2e;
            color: #f0f0f5;
        }

        .form-input.readonly {
            background: rgba(0, 0, 0, 0.2);
            color: #6a6f8a;
            cursor: not-allowed;
            border-color: rgba(255, 255, 255, 0.06);
        }
        .readonly-hint {
            font-size: 0.7rem;
            color: #6a6f8a;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .save-btn {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            border: none;
            border-radius: 60px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: 0.25s;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4);
            margin-top: 0.5rem;
        }
        .save-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 20px rgba(34, 197, 94, 0.6);
        }

        .change-pwd-btn {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border: none;
            border-radius: 60px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: 0.25s;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
            margin-top: 0.5rem;
        }
        .change-pwd-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 20px rgba(245, 158, 11, 0.6);
        }

        .pwd-hint {
            font-size: 0.7rem;
            color: #6a6f8a;
            margin-top: 4px;
        }

        .status-msg {
            text-align: center;
            font-size: 0.85rem;
            margin-top: 1rem;
            min-height: 20px;
        }
        .status-msg.success { color: #22c55e; }
        .status-msg.error { color: #ef4444; }
        .status-msg.info { color: #8e93b0; }

        @media (max-width: 500px) {
            .edit-card { padding: 1.5rem; }
            .top-bar .title-box h1 { font-size: 1.2rem; }
            .menu-row { padding: 1.1rem 1.2rem; gap: 1rem; }
            .menu-row .row-icon { width: 46px; height: 46px; min-width: 46px; font-size: 1.2rem; }
            .menu-row .row-label { font-size: 0.95rem; }
        }
    </style>
</head>
<body>

<div class="admin-container">

    <!-- ===== 頂部標題列 ===== -->
    <div class="top-bar" id="topBar" style="display: none;">
        <div class="title-box">
            <h1>🔧 管理介面</h1>
            <p>Chan Hyc 秘密基地 · 內容管理系統</p>
        </div>
        <button class="logout-top-btn" id="logoutBtn">
            <i class="fas fa-sign-out-alt"></i> 登出
        </button>
    </div>

    <!-- ===== 登入畫面 ===== -->
    <div class="login-box" id="loginBox">
        <div class="lock-icon">🔒</div>
        <h2>請輸入管理密碼</h2>
        <input type="password" class="password-input" id="passwordInput" placeholder="請輸入密碼...">
        <button class="login-btn" id="loginBtn">登 入</button>
        <div class="login-error" id="loginError"></div>
    </div>

    <!-- ===== 主選單（一排一排） ===== -->
    <div class="main-menu" id="mainMenu">
        <div class="menu-list">

            <div class="menu-row" data-target="motto">
                <div class="row-icon">📜</div>
                <div class="row-content">
                    <div class="row-label">座右銘</div>
                    <div class="row-desc">編輯座右銘內容</div>
                </div>
                <div class="row-arrow"><i class="fas fa-chevron-right"></i></div>
            </div>

            <div class="menu-row" data-target="info">
                <div class="row-icon">👤</div>
                <div class="row-content">
                    <div class="row-label">個人資料</div>
                    <div class="row-desc">編輯學歷、年齡、感情</div>
                </div>
                <div class="row-arrow"><i class="fas fa-chevron-right"></i></div>
            </div>

            <div class="menu-row" data-target="cancer">
                <div class="row-icon">♋</div>
                <div class="row-content">
                    <div class="row-label">巨蟹座</div>
                    <div class="row-desc">編輯巨蟹座內容</div>
                </div>
                <div class="row-arrow"><i class="fas fa-chevron-right"></i></div>
            </div>

            <div class="menu-row" data-target="password">
                <div class="row-icon">🔑</div>
                <div class="row-content">
                    <div class="row-label">變更密碼</div>
                    <div class="row-desc">修改管理密碼</div>
                </div>
                <div class="row-arrow"><i class="fas fa-chevron-right"></i></div>
            </div>

        </div>
        <div class="status-msg info" id="statusMsg"></div>
    </div>

    <!-- ===== 編輯頁面：座右銘 ===== -->
    <div class="edit-page" id="page-motto">
        <button class="back-btn" onclick="backToMenu()">
            <i class="fas fa-arrow-left"></i> 返回選單
        </button>
        <div class="edit-card">
            <h3><i class="fas fa-quote-left"></i> 編輯座右銘</h3>
            <div class="form-group">
                <label>座右銘內容（可換行）</label>
                <textarea class="form-textarea" id="mottoInput" placeholder="請輸入座右銘..."></textarea>
            </div>
            <button class="save-btn" id="saveMottoBtn">💾 儲存座右銘</button>
            <div class="status-msg" id="statusMotto"></div>
        </div>
    </div>

    <!-- ===== 編輯頁面：個人資料 ===== -->
    <div class="edit-page" id="page-info">
        <button class="back-btn" onclick="backToMenu()">
            <i class="fas fa-arrow-left"></i> 返回選單
        </button>
        <div class="edit-card">
            <h3><i class="fas fa-id-card"></i> 編輯個人資料</h3>

            <div class="form-group">
                <label>📍 哪裡人（不可修改）</label>
                <input type="text" class="form-input readonly" id="infoLocation" readonly>
                <div class="readonly-hint"><i class="fas fa-lock"></i> 此欄位固定，無法修改</div>
            </div>
            <div class="form-group">
                <label>🎓 學歷</label>
                <input type="text" class="form-input" id="infoEducation" placeholder="例如：就讀高中職">
            </div>
            <div class="form-group">
                <label>📅 幾年（不可修改）</label>
                <input type="text" class="form-input readonly" id="infoYear" readonly>
                <div class="readonly-hint"><i class="fas fa-lock"></i> 此欄位固定，無法修改</div>
            </div>
            <div class="form-group">
                <label>🎂 生日（不可修改）</label>
                <input type="text" class="form-input readonly" id="infoBirthday" readonly>
                <div class="readonly-hint"><i class="fas fa-lock"></i> 此欄位固定，無法修改</div>
            </div>
            <div class="form-group">
                <label>🧒 年齡（下拉選單）</label>
                <select class="form-select" id="infoAge"></select>
            </div>
            <div class="form-group">
                <label>❤️ 感情狀態（下拉選單）</label>
                <select class="form-select" id="infoRelationship">
                    <option value="單身">單身</option>
                    <option value="穩定交往中">穩定交往中</option>
                    <option value="不透露">不透露</option>
                    <option value="有喜歡的人">有喜歡的人</option>
                    <option value="已訂婚">已訂婚</option>
                    <option value="已婚">已婚</option>
                    <option value="離婚">離婚</option>
                </select>
            </div>
            <div class="form-group">
                <label>♋ 星座（不可修改）</label>
                <input type="text" class="form-input readonly" id="infoZodiac" readonly>
                <div class="readonly-hint"><i class="fas fa-lock"></i> 此欄位固定，無法修改</div>
            </div>
            <div class="form-group">
                <label>🩸 血型（不可修改）</label>
                <input type="text" class="form-input readonly" id="infoBlood" readonly>
                <div class="readonly-hint"><i class="fas fa-lock"></i> 此欄位固定，無法修改</div>
            </div>

            <button class="save-btn" id="saveInfoBtn">💾 儲存個人資料</button>
            <div class="status-msg" id="statusInfo"></div>
        </div>
    </div>

    <!-- ===== 編輯頁面：巨蟹座 ===== -->
    <div class="edit-page" id="page-cancer">
        <button class="back-btn" onclick="backToMenu()">
            <i class="fas fa-arrow-left"></i> 返回選單
        </button>
        <div class="edit-card">
            <h3><i class="fas fa-crab"></i> 編輯巨蟹座內容</h3>
            <div class="form-group">
                <label>巨蟹座內容（可換行）</label>
                <textarea class="form-textarea" id="cancerInput" placeholder="請輸入巨蟹座內容..."></textarea>
            </div>
            <button class="save-btn" id="saveCancerBtn">💾 儲存巨蟹座</button>
            <div class="status-msg" id="statusCancer"></div>
        </div>
    </div>

    <!-- ===== 編輯頁面：變更密碼 ===== -->
    <div class="edit-page" id="page-password">
        <button class="back-btn" onclick="backToMenu()">
            <i class="fas fa-arrow-left"></i> 返回選單
        </button>
        <div class="edit-card">
            <h3><i class="fas fa-key"></i> 變更管理密碼</h3>
            <div class="form-group">
                <label>目前密碼</label>
                <input type="password" class="form-input" id="currentPwd" placeholder="請輸入目前密碼">
            </div>
            <div class="form-group">
                <label>新密碼</label>
                <input type="password" class="form-input" id="newPwd" placeholder="請輸入新密碼">
                <div class="pwd-hint">建議 6 個字元以上</div>
            </div>
            <div class="form-group">
                <label>確認新密碼</label>
                <input type="password" class="form-input" id="confirmPwd" placeholder="請再次輸入新密碼">
            </div>
            <button class="change-pwd-btn" id="changePwdBtn">🔑 變更密碼</button>
            <div class="status-msg" id="statusPassword"></div>
        </div>
    </div>

</div>

<script>
    // ============================================================
    // Firebase 設定
    // ============================================================
    const firebaseConfig = {
        databaseURL: "https://mehyc-7eabb-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // ============================================================
    // 動態生成年齡下拉選單（1~100 歲）
    // ============================================================
    (function generateAgeOptions() {
        const ageSelect = document.getElementById('infoAge');
        if (!ageSelect) return;

        const defaultOption = document.createElement('option');
        defaultOption.value = '不透露';
        defaultOption.textContent = '不透露';
        ageSelect.appendChild(defaultOption);

        for (let i = 1; i <= 100; i++) {
            const option = document.createElement('option');
            option.value = i + '歲';
            option.textContent = i + '歲';
            ageSelect.appendChild(option);
        }
    })();

    // ============================================================
    // 頁面元素
    // ============================================================
    const topBar = document.getElementById('topBar');
    const loginBox = document.getElementById('loginBox');
    const mainMenu = document.getElementById('mainMenu');
    const passwordInput = document.getElementById('passwordInput');
    const loginBtn = document.getElementById('loginBtn');
    const loginError = document.getElementById('loginError');
    const logoutBtn = document.getElementById('logoutBtn');

    // ============================================================
    // 登入邏輯
    // ============================================================
    if (sessionStorage.getItem('adminLoggedIn') === 'true') {
        showMainMenu();
    }

    loginBtn.addEventListener('click', async () => {
        const pwd = passwordInput.value.trim();
        if (!pwd) {
            loginError.textContent = '❌ 請輸入密碼';
            return;
        }
        loginBtn.disabled = true;
        loginBtn.textContent = '驗證中...';
        loginError.textContent = '';

        try {
            const snapshot = await db.ref('admin/password').once('value');
            const correctPwd = snapshot.val() || 'hyc0628';

            if (pwd === correctPwd) {
                sessionStorage.setItem('adminLoggedIn', 'true');
                showMainMenu();
            } else {
                loginError.textContent = '❌ 密碼錯誤，請重新輸入';
                passwordInput.value = '';
            }
        } catch (err) {
            if (pwd === 'hyc0628') {
                sessionStorage.setItem('adminLoggedIn', 'true');
                showMainMenu();
            } else {
                loginError.textContent = '❌ 密碼錯誤';
            }
        } finally {
            loginBtn.disabled = false;
            loginBtn.textContent = '登 入';
        }
    });

    passwordInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') loginBtn.click();
    });

    logoutBtn.addEventListener('click', () => {
        sessionStorage.removeItem('adminLoggedIn');
        location.reload();
    });

    function showMainMenu() {
        loginBox.style.display = 'none';
        topBar.style.display = 'flex';
        mainMenu.classList.add('active');
        loadAllData();
    }

    // ============================================================
    // 選單點擊 → 進入對應編輯頁
    // ============================================================
    document.querySelectorAll('.menu-row').forEach(row => {
        row.addEventListener('click', () => {
            const target = row.dataset.target;
            mainMenu.classList.remove('active');
            document.querySelectorAll('.edit-page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + target).classList.add('active');
        });
    });

    function backToMenu() {
        document.querySelectorAll('.edit-page').forEach(p => p.classList.remove('active'));
        mainMenu.classList.add('active');
        document.querySelectorAll('.status-msg').forEach(el => el.textContent = '');
    }
    window.backToMenu = backToMenu;

    // ============================================================
    // 載入所有資料
    // ============================================================

        db.ref('content/profile').once('value').then(snapshot => {

                education: '就讀高中職',

                birthday: '0628',
                age: '17歲',

            document.getElementById('infoLocation').value = info.location || '彰化人';
            document.getElementById('infoYear').value = info.year || '09年';
            document.getElementById('infoBirthday').value = info.birthday || '0628';
            document.getElementById('infoZodiac').value = info.zodiac || '巨蟹座';
            document.getElementById('infoBlood').value = info.blood || 'Aˉ';
            document.getElementById('infoEducation').value = info.education || '';

            // 年齡下拉選單
            const ageSelect = document.getElementById('infoAge');

                ageSelect.appendChild(newOption);

            ageSelect.value = ageValue;

            // 感情下拉選單
            document.getElementById('infoRelationship').value = info.relationship || '不透露';
        });

        // 載入巨蟹座
        db.ref('content/cancer').once('value').then(snapshot => {

    // ============================================================
    // 儲存座右銘
    // ============================================================
    document.getElementById('saveMottoBtn').addEventListener('click', () => {
        const content = document.getElementById('mottoInput').value;
        showStatus('statusMotto', 'info', '⏳ 儲存中...');

        db.ref('content/motto').set(content)
            .then(() => showStatus('statusMotto', 'success', '✅ 座右銘已儲存並同步！'))
            .catch(err => showStatus('statusMotto', 'error', '❌ 儲存失敗：' + err.message));
    });

    // ============================================================
    // 儲存個人資料
    // ============================================================
    document.getElementById('saveInfoBtn').addEventListener('click', () => {
        db.ref('content/profile').once('value').then(snapshot => {
            const existing = snapshot.val() || {};
            const data = {
                location: existing.location || '彰化人',
                year: existing.year || '09年',
                birthday: existing.birthday || '0628',
                zodiac: existing.zodiac || '巨蟹座',
                blood: existing.blood || 'Aˉ',
                education: document.getElementById('infoEducation').value,
                age: document.getElementById('infoAge').value,
                relationship: document.getElementById('infoRelationship').value
            };
            showStatus('statusInfo', 'info', '⏳ 儲存中...');
            return db.ref('content/profile').set(data);
        })
        .then(() => showStatus('statusInfo', 'success', '✅ 個人資料已儲存並同步！'))
        .catch(err => showStatus('statusInfo', 'error', '❌ 儲存失敗：' + err.message));
    });

    // ============================================================
    // 儲存巨蟹座
    // ============================================================
    document.getElementById('saveCancerBtn').addEventListener('click', () => {
        const content = document.getElementById('cancerInput').value;
        showStatus('statusCancer', 'info', '⏳ 儲存中...');

        db.ref('content/cancer').set(content)
            .then(() => showStatus('statusCancer', 'success', '✅ 巨蟹座已儲存並同步！'))
            .catch(err => showStatus('statusCancer', 'error', '❌ 儲存失敗：' + err.message));
    });

    // ============================================================
    // 變更密碼
    // ============================================================
    document.getElementById('changePwdBtn').addEventListener('click', async () => {
        const currentPwd = document.getElementById('currentPwd').value.trim();
        const newPwd = document.getElementById('newPwd').value.trim();
        const confirmPwd = document.getElementById('confirmPwd').value.trim();

        if (!currentPwd || !newPwd || !confirmPwd) {
            showStatus('statusPassword', 'error', '❌ 請填寫所有欄位');
            return;
        }
        if (newPwd.length < 6) {
            showStatus('statusPassword', 'error', '❌ 新密碼至少需要 6 個字元');
            return;
        }
        if (newPwd !== confirmPwd) {
            showStatus('statusPassword', 'error', '❌ 兩次輸入的新密碼不一致');
            return;
        }
        if (newPwd === currentPwd) {
            showStatus('statusPassword', 'error', '❌ 新密碼不能與目前密碼相同');
            return;
        }

        showStatus('statusPassword', 'info', '⏳ 驗證中...');

        try {
            const snapshot = await db.ref('admin/password').once('value');
            const correctPwd = snapshot.val() || 'hyc0628';

            if (currentPwd !== correctPwd) {
                showStatus('statusPassword', 'error', '❌ 目前密碼錯誤');
                return;
            }

            await db.ref('admin/password').set(newPwd);
            showStatus('statusPassword', 'success', '✅ 密碼已成功變更！下次登入請使用新密碼');

            document.getElementById('currentPwd').value = '';
            document.getElementById('newPwd').value = '';
            document.getElementById('confirmPwd').value = '';
        } catch (err) {
            showStatus('statusPassword', 'error', '❌ 變更失敗：' + err.message);
        }
    });

    // ============================================================
    // 狀態訊息
    // ============================================================
    const statusTimers = {};
    function showStatus(elementId, type, msg) {
        const el = document.getElementById(elementId);
        if (!el) return;
        el.className = 'status-msg ' + type;
        el.textContent = msg;
        if (statusTimers[elementId]) clearTimeout(statusTimers[elementId]);
        if (type === 'success' || type === 'error') {
            statusTimers[elementId] = setTimeout(() => {
                el.textContent = '';
            }, 4000);
        }
    }
</script>
